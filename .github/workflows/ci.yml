name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build + test (macOS 14)
    runs-on: macos-14
    timeout-minutes: 20

    env:
      PROJECT: TAELMacAgent/TAELMacAgent.xcodeproj
      SCHEME: TAELMacAgent
      DEST: platform=macOS

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Resolve SPM packages
        run: |
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DEST" \
            -resolvePackageDependencies

      - name: Build (Debug)
        run: |
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "$DEST" \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Test
        run: |
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "$DEST" \
            CODE_SIGNING_ALLOWED=NO \
            test
