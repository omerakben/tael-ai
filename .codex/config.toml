# GitHub MCP over SSE (OAuth). First use prompts for browser auth.
[mcp_servers.github]
type = "sse"
url = "https://mcp.github.com/sse"

# ============================================================================
# Profiles
# ============================================================================

# Review and check passes only — NOT for building.
[profiles.fast]
model = "gpt-5.5"
model_reasoning_effort = "medium"

# Hardest architectural decisions and multi-file reasoning.
[profiles.thorough]
model = "gpt-5.5"
model_reasoning_effort = "xhigh"

